<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>AR Character</title>
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:,">
</head>
<body>

<!-- ============ LAUNCH SCREEN ============ -->
<section id="launch" class="screen">
  <header class="masthead">
    <h1>AR Character</h1>
    <p class="sub">Put a character in the world through your camera.</p>
  </header>

  <div class="modes">
    <button class="mode-card" id="pick-road" disabled>
      <span class="mode-icon" aria-hidden="true">&#9673;</span>
      <span class="mode-body">
        <span class="mode-name">Road</span>
        <span class="mode-desc">Point out a car window. The character runs alongside and vaults what goes past.</span>
      </span>
      <span class="mode-state" data-state>checking&hellip;</span>
    </button>

    <button class="mode-card" id="pick-room" disabled>
      <span class="mode-icon" aria-hidden="true">&#9635;</span>
      <span class="mode-body">
        <span class="mode-name">Room</span>
        <span class="mode-desc">Place the character on your floor. It stays put as you walk around.</span>
      </span>
      <span class="mode-state" data-state>checking&hellip;</span>
    </button>
  </div>

  <details class="probe">
    <summary>Device capabilities</summary>
    <ul id="probe-list"></ul>
  </details>

  <p class="safety">Passenger seat only. Never while driving.</p>
</section>

<!-- ============ STAGE ============ -->
<section id="stage" class="screen hidden">
  <video id="feed" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>

  <!-- dom-overlay root. Only this subtree is composited into the AR view, and
       it MUST stay transparent: any opaque background in here paints over the
       camera passthrough and you get a black screen instead of your room. -->
  <div id="ar-overlay">
    <div id="hud" class="hud hidden">
      <div class="hud-row"><span class="hud-k">speed</span><span class="hud-v" id="hud-speed">—</span></div>
      <div class="hud-row"><span class="hud-k">state</span><span class="hud-v" id="hud-state">—</span></div>
      <div class="hud-row"><span class="hud-k">tracked</span><span class="hud-v" id="hud-obs">—</span></div>
      <div class="hud-row"><span class="hud-k">fps</span><span class="hud-v" id="hud-fps">—</span></div>
    </div>

    <div id="reticle-hint" class="hint hidden">Point at the floor, then tap to place</div>
    <div id="toast" class="toast hidden"></div>

    <div class="stage-controls">
      <button id="btn-back" class="ctl" title="Back">&#8592;</button>
      <button id="btn-hud" class="ctl" title="Toggle readout">&#9636;</button>
      <button id="btn-wave" class="ctl" title="Wave">&#9995;</button>
    </div>
  </div>
</section>

<div id="boot" class="boot hidden"><div class="spinner"></div><span id="boot-msg">loading</span></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
